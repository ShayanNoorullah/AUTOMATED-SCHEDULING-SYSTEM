<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>User detail · Admin · SSIES</title>
<link rel="icon" href="assets/img/favicon-32.png"/>
<script>(function(){var m=localStorage.getItem("theme-mode")||"system";var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");var a=localStorage.getItem("accent")||(d?"#2dd4bf":"#0d9488");if(a.toLowerCase()==="#0000ee")a=(d?"#2dd4bf":"#0d9488");document.documentElement.style.setProperty("--accent",a);document.documentElement.setAttribute("data-nav",localStorage.getItem("nav-layout")||"sidebar");})();</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="assets/css/app.css?v=18" rel="stylesheet"/>
</head>
<body>
<div class="shell" id="shell">
  <div class="scrim" onclick="toggleRail()"></div>
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleRail()" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="tt"><h2 id="uEmail">User</h2><p>Account management</p></div>
      <div class="topbar-actions"><a href="admin-users.html" class="btn btn-soft btn-sm">Back to users</a><button class="icon-btn" id="quickTheme" onclick="quickToggleTheme()" title="Toggle theme">🌙</button></div>
    </div>
    <div class="page-pad">
      <div class="cards" id="stats"></div>
      <div class="card" style="margin-top:20px;padding:22px;max-width:560px">
        <div class="profile-form">
          <div class="profile-field"><label>Display name</label><input id="displayName"/></div>
          <label class="wa-check-row" style="padding:0"><input type="checkbox" id="isActive"/><span><strong>Account active</strong><span class="sub">Disabled users cannot sign in</span></span></label>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
            <button class="btn btn-primary" onclick="save()">Save</button>
            <button class="btn btn-soft" onclick="resetPw()">Send password reset</button>
            <button class="btn btn-danger" onclick="del()">Delete user</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="assets/js/store.js?v=18"></script>
<script src="assets/js/theme.js?v=18"></script>
<script src="assets/js/portal.js?v=18"></script>
<script>
initPortal({ kind: "admin", active: "users" });
applyTheme();
const uid = new URLSearchParams(location.search).get("id");
const target = findUser(uid);
if (!target) { toast("User not found", "err"); setTimeout(()=>location.href="admin-users.html", 1200); }
else render();
function render(){
  document.getElementById("uEmail").textContent = target.email;
  const s = userStats(uid);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${s.groupCount}</div><div class="l">Groups</div></div>
    <div class="stat"><div class="n">${s.contactCount}</div><div class="l">Contacts</div></div>
    <div class="stat"><div class="n">${s.templateCount}</div><div class="l">Templates</div></div>`;
  document.getElementById("displayName").value = target.displayName || "";
  document.getElementById("isActive").checked = !!target.isActive;
}
function save(){ updateUser(uid, { displayName: document.getElementById("displayName").value.trim(), isActive: document.getElementById("isActive").checked }); toast("Saved"); }
function resetPw(){ toast("Reset email sent"); }
function del(){ if (!confirm("Delete this user permanently?")) return; deleteUser(uid); location.href = "admin-users.html"; }
</script>
</body>
</html>
