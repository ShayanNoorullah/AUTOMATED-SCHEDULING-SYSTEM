<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audit log · Superadmin · SSIES</title>
<link rel="icon" href="assets/img/favicon-32.png"/>
<script>(function(){var m=localStorage.getItem("theme-mode")||"system";var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");var a=localStorage.getItem("accent")||(d?"#2dd4bf":"#0d9488");if(a.toLowerCase()==="#0000ee")a=(d?"#2dd4bf":"#0d9488");document.documentElement.style.setProperty("--accent",a);document.documentElement.setAttribute("data-nav",localStorage.getItem("nav-layout")||"sidebar");})();</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="assets/css/app.css?v=18" rel="stylesheet"/>
</head>
<body>
<div class="shell" id="shell">
  <div class="scrim" onclick="toggleRail()"></div>
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleRail()" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="tt"><h2>Global audit log</h2><p>Every action across the system</p></div>
      <div class="topbar-actions"><button class="btn btn-soft btn-sm" onclick="exportAudit()">Export CSV</button><button class="icon-btn" id="quickTheme" onclick="quickToggleTheme()" title="Toggle theme">🌙</button></div>
    </div>
    <div class="page-pad">
      <div id="auditTable"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="assets/js/store.js?v=18"></script>
<script src="assets/js/theme.js?v=18"></script>
<script src="assets/js/portal.js?v=18"></script>
<script>
initPortal({ kind: "superadmin", active: "audit" });
applyTheme();
const ACT_LABEL = { login:"Signed in", login_failed:"Failed login", logout:"Signed out", user_create:"Created user", user_update:"Updated user", user_delete:"Deleted user", role_change:"Changed role", role_add:"Added role", role_update:"Updated role", role_delete:"Deleted role", release:"Released messages", direct_whatsapp:"Opened WhatsApp", settings_update:"Updated settings", config_restore:"Restored config" };
function actLabel(a){ return ACT_LABEL[a]||a; }
function actorOptions(){ const set=[...new Set(STORE.globalAudit.map(r=>r.actorEmail).filter(Boolean))]; return [{val:"",label:"All actors"}].concat(set.map(e=>({val:e,label:e}))); }
function actionOptions(){ const set=[...new Set(STORE.globalAudit.map(r=>r.action))]; return [{val:"",label:"All actions"}].concat(set.map(a=>({val:a,label:actLabel(a)}))); }
portalTable({
  id:"tblAudit", mount:"auditTable", perPage:10,
  searchPlaceholder:"Search actions, details, actors…", emptyText:"No audit entries", emptyIco:"📜",
  getRows:()=> STORE.globalAudit,
  searchKeys:[(r)=>actLabel(r.action), "detail", "actorEmail"],
  filters:[
    { key:"action", options:actionOptions(), match:(r,v)=>r.action===v },
    { key:"actor", options:actorOptions(), match:(r,v)=>r.actorEmail===v },
  ],
  columns:[
    { label:"Time", render:(r)=>fmtDate(r.at) },
    { label:"Action", render:(r)=>`<span class="chip">${esc(actLabel(r.action))}</span>` },
    { label:"Detail", render:(r)=>esc(r.detail||"—") },
    { label:"Actor", render:(r)=>esc(r.actorEmail||"—") },
    { label:"IP", render:(r)=>esc(r.ip||"—") },
  ],
});
function exportAudit(){
  const rows=[["time","action","detail","actor","ip"], ...STORE.globalAudit.map(r=>[r.at,r.action,r.detail,r.actorEmail||"",r.ip])];
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="audit_export.csv"; a.click(); URL.revokeObjectURL(a.href); toast("Audit CSV exported ✓");
}
</script>
</body>
</html>
