<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset password · SSIES Schedule Sender</title>
<link rel="icon" href="assets/img/favicon-32.png"/>
<script>(function(){var m=localStorage.getItem("theme-mode")||"system";var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");var a=localStorage.getItem("accent")||(d?"#2dd4bf":"#0d9488");if(a.toLowerCase()==="#0000ee")a=(d?"#2dd4bf":"#0d9488");document.documentElement.style.setProperty("--accent",a);document.documentElement.setAttribute("data-nav",localStorage.getItem("nav-layout")||"sidebar");})();</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="assets/css/app.css?v=18" rel="stylesheet"/>
</head>
<body>
<div class="auth-shell">
  <section class="auth-hero" aria-hidden="true">
    <div class="auth-hero-inner">
      <div class="auth-logo"><img src="assets/img/ssies-logo.png" alt="SSIES"/></div>
      <h1>Forgot your<br/><span>password?</span></h1>
      <p>Enter your SSIES email and we'll send a secure reset link. Only administrator-created accounts can reset.</p>
    </div>
  </section>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/img/ssies-logo.png" alt="SSIES"/>
        <div><h1>Schedule Sender</h1><p>SSIES Automation</p></div>
      </div>
      <div class="eyebrow">Password reset</div>
      <h2>Reset your password</h2>
      <p class="auth-sub">We'll email a reset link if the account exists.</p>
      <div class="auth-err" id="err" role="alert" aria-live="assertive"></div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="field" id="email" type="email" placeholder="you@ssies.edu.pk" autofocus onkeydown="if(event.key==='Enter')submitForm()"/>
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="go" onclick="submitForm()">Send reset link</button>
      <div class="auth-foot"><a href="login.html">← Back to sign in</a></div>
    </div>
  </section>
</div>
<script src="assets/js/store.js?v=18"></script>
<script>
function submitForm(){
  const email = document.getElementById("email").value.trim();
  if(!email){ document.getElementById("err").textContent = "Enter your email."; return; }
  document.getElementById("err").textContent = "";
  toast("If that account exists, a reset link has been sent ✓");
  setTimeout(()=>location.href="login.html", 1600);
}
</script>
</body>
</html>
