<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset password · SSIES</title>
{% include "_favicon.html" %}
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#0000EE;--muted:#6B7280;--error:#DC2626;--ok:#059669;--border:rgba(17,24,39,.12);}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Satoshi',system-ui,sans-serif;background:#F5F6F8;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;
  }
  .card{
    background:#fff;border-radius:24px;padding:28px 24px;width:100%;max-width:420px;
    box-shadow:0 16px 48px rgba(15,23,42,.12);border:1px solid var(--border);
  }
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px;}
  p{color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.5;}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  input{
    width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;
    font-size:16px;font-family:inherit;background:#F8F9FB;
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,238,.12);background:#fff;}
  button{
    width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;
    font-weight:700;cursor:pointer;font-family:inherit;font-size:15px;
  }
  button:hover{filter:brightness(.94);}
  .msg{font-size:13px;margin-top:12px;color:var(--ok);}
  .err{color:var(--error);font-size:13px;margin-bottom:12px;min-height:18px;}
  .back{margin-top:18px;font-size:13px;}
  a{color:var(--accent);font-weight:600;text-decoration:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
  <div class="eyebrow">Account</div>
  <h1>Reset password</h1>
  <p>Enter your email and we’ll send a reset link.</p>
  <div class="err" id="err"></div>
  <label for="email">Email</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
  <button type="button" onclick="reset()">Send reset link</button>
  <div class="msg" id="msg"></div>
  <p class="back"><a href="/login">← Back to sign in</a></p>
</div>
<script>
const sb = window.supabase.createClient({{ supabase_url|tojson }}, {{ supabase_anon_key|tojson }});
async function reset(){
  document.getElementById("err").textContent = "";
  document.getElementById("msg").textContent = "";
  const email = document.getElementById("email").value.trim();
  if(!email){ document.getElementById("err").textContent = "Email required"; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/login" });
  if(error){ document.getElementById("err").textContent = error.message; return; }
  document.getElementById("msg").textContent = "Check your email for the reset link.";
}
</script>
</body>
</html>
