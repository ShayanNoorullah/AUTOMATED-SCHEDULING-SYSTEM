{# Shared user dashboard nav — used by index + profile #}
{% set active_view = active_view|default('groups') %}
<button class="nav-item{% if active_view == 'dashboard' %} active{% endif %}" data-view="dashboard" onclick="{% if profile_mode %}location.href='/?view=dashboard'{% else %}navGo('dashboard'){% endif %}" title="Dashboard" type="button">
  <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
  <span class="lbl">Dashboard</span>
</button>
<div class="nav-group{% if active_view in ('groups','contacts','table','board','lists','group-detail','contact-detail') %} open has-active{% endif %}" id="navSchedGroup">
  <button class="nav-item nav-group-btn" onclick="toggleNavGroup(this)" title="Scheduler" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
    <span class="lbl">Scheduler</span>
    <svg class="caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="nav-submenu">
    <button class="nav-item nav-sub{% if active_view in ('groups','group-detail') %} active{% endif %}" data-view="groups" onclick="{% if profile_mode %}location.href='/?view=groups'{% else %}navGo('groups'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span><span class="lbl">Groups</span></button>
    <button class="nav-item nav-sub{% if active_view in ('contacts','contact-detail') %} active{% endif %}" data-view="contacts" onclick="{% if profile_mode %}location.href='/?view=contacts'{% else %}navGo('contacts'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="lbl">Contacts</span></button>
    <button class="nav-item nav-sub{% if active_view == 'table' %} active{% endif %}" data-view="table" data-sched="table" onclick="{% if profile_mode %}location.href='/?view=table'{% else %}navSched('table'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg></span><span class="lbl">Table view</span></button>
    <button class="nav-item nav-sub" data-view="table" data-sched="board" onclick="{% if profile_mode %}location.href='/?view=table&sched=board'{% else %}navSched('board'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/></svg></span><span class="lbl">Board view</span></button>
    <button class="nav-item nav-sub{% if active_view == 'lists' %} active{% endif %}" data-view="lists" onclick="{% if profile_mode %}location.href='/?view=lists'{% else %}navGo('lists'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span class="lbl">Lists</span></button>
  </div>
</div>
<div class="nav-group{% if active_view in ('wa-direct','wa-auto','templates','history') %} open has-active{% endif %}" id="navMsgGroup">
  <button class="nav-item nav-group-btn" onclick="toggleNavGroup(this)" title="Messaging" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
    <span class="lbl">Messaging</span>
    <svg class="caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="nav-submenu">
    <button class="nav-item nav-sub{% if active_view == 'wa-direct' %} active{% endif %}" data-view="wa-direct" onclick="{% if profile_mode %}location.href='/?view=wa-direct'{% else %}navGo('wa-direct'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg></span><span class="lbl">Open in WhatsApp</span></button>
    <button class="nav-item nav-sub{% if active_view == 'wa-auto' %} active{% endif %}" data-view="wa-auto" onclick="{% if profile_mode %}location.href='/?view=wa-auto'{% else %}navGo('wa-auto'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span><span class="lbl">Automated Send</span></button>
    <button class="nav-item nav-sub{% if active_view == 'templates' %} active{% endif %}" data-view="templates" onclick="{% if profile_mode %}location.href='/?view=templates'{% else %}navGo('templates'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></span><span class="lbl">Templates</span></button>
    <button class="nav-item nav-sub{% if active_view == 'history' %} active{% endif %}" data-view="history" onclick="{% if profile_mode %}location.href='/?view=history'{% else %}navGo('history'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 3"/></svg></span><span class="lbl">Send History</span></button>
  </div>
</div>
<div class="nav-group{% if active_view in ('settings','profile','notifications') or profile_mode %} open has-active{% endif %}" id="navAccountGroup">
  <button class="nav-item nav-group-btn" onclick="toggleNavGroup(this)" title="Account" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    <span class="lbl">Account</span>
    <svg class="caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="nav-submenu">
    <button class="nav-item nav-sub{% if active_view == 'settings' %} active{% endif %}" data-view="settings" onclick="{% if profile_mode %}location.href='/?view=settings'{% else %}navGo('settings'){% endif %}" type="button"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span><span class="lbl">Settings</span></button>
    <a class="nav-item nav-sub{% if active_view == 'notifications' %} active{% endif %}" href="/notifications"><span class="ico"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span><span class="lbl">Notifications</span></a>
    <a class="nav-item nav-sub{% if active_view == 'profile' %} active{% endif %}" href="/profile"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="lbl">Profile</span></a>
  </div>
</div>
<div class="nav-group nav-more hidden" id="navMoreGroup">
  <button class="nav-item nav-group-btn" onclick="toggleNavGroup(this)" title="More" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>
    <span class="lbl">More</span>
    <svg class="caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="nav-submenu" id="navMoreMenu"></div>
</div>
