# Production stack: Flask + WAHA pool + Caddy (HTTPS via DuckDNS)
# Usage: cp .env.production.example .env && docker compose -f docker-compose.prod.yml up -d --build
#
# WAHA Core (free) = 1 WhatsApp per container. We run several identical free
# containers so each SSIES user/admin/superadmin can link their own number.
# No WAHA Plus license — same free image, same Oracle VM (no extra cloud cost).

x-waha: &waha-common
  # Pin free Core NOWEB ARM image (no Plus license). 2026.7.2 fixes WhatsApp protocol Connection Failure.
  image: devlikeapro/waha:noweb-arm-2026.9.1
  restart: unless-stopped
  environment:
    WAHA_API_KEY: ${WAHA_API_KEY}
    WAHA_PRINT_QR: "False"
  networks:
    - ssies
  # Port 3000 is NOT published — only reachable from app container

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER: "1"
      USE_WAITRESS: "1"
      FORCE_HTTPS: "1"
      PORT: "5000"
      WAHA_BASE_URL: http://waha:3000
      WAHA_SLOTS: ${WAHA_SLOTS:-5}
    volumes:
      # Persist profile/group/contact photos across rebuilds
      - app-instance:/app/instance
    depends_on:
      - waha
      - waha2
      - waha3
      - waha4
      - waha5
    networks:
      - ssies

  # Optional local model for the Scheduler Assistant's fallback. Used only when the hosted
  # provider fails or is not set up. Reachable from the app container only (no published port).
  # One-time setup after the first start:
  #   docker compose -f docker-compose.prod.yml up -d ollama
  #   docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen2.5:7b
  # then in the portal: Settings → Automation → Local fallback =
  #   http://ollama:11434/v1   and   qwen2.5:7b
  # Measured on this VM (2 ARM cores): ~2.5 min to load, then 20–50 s per answer, ~5 GB RAM.
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h          # stay loaded for the day once the fallback has been needed
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    mem_limit: 7g                     # the model needs ~5 GB; this stops it starving the app and WAHA
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ssies

  # Slot 1 — keeps existing volume name so the current QR session is preserved
  waha:
    <<: *waha-common
    volumes:
      - waha-sessions:/app/.sessions

  waha2:
    <<: *waha-common
    volumes:
      - waha-sessions-2:/app/.sessions

  waha3:
    <<: *waha-common
    volumes:
      - waha-sessions-3:/app/.sessions

  waha4:
    <<: *waha-common
    volumes:
      - waha-sessions-4:/app/.sessions

  waha5:
    <<: *waha-common
    volumes:
      - waha-sessions-5:/app/.sessions

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - ssies

volumes:
  app-instance:
  waha-sessions:
  waha-sessions-2:
  waha-sessions-3:
  waha-sessions-4:
  waha-sessions-5:
  caddy_data:
  caddy_config:
  ollama-models:

networks:
  ssies:
    driver: bridge
